<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARWIS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070c;--pn:rgba(10,16,26,.8);--cy:#27e6ff;--rd:#ff2d3d;--go:#ffb81c;--tx:#dff6ff;--dm:#7f98a8;--core:#27e6ff;--k:1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:500 17px/1.35 Rajdhani,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 24%,rgba(39,230,255,.17),transparent 55%),linear-gradient(rgba(39,230,255,.05) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(39,230,255,.05) 1px,transparent 1px) 0 0/32px 32px}
body::after{content:"";position:fixed;left:0;right:0;top:-140px;height:140px;pointer-events:none;background:linear-gradient(transparent,rgba(39,230,255,.08),transparent);animation:scan 7s linear infinite}
@keyframes scan{to{transform:translateY(calc(100vh + 140px))}}
.app{position:relative;height:100%;display:flex;flex-direction:column;gap:8px;padding:10px 16px 10px}
.app::before{content:"";position:absolute;inset:2px 6px;pointer-events:none;opacity:.7;background:linear-gradient(var(--cy),var(--cy)) top left/22px 2px,linear-gradient(var(--cy),var(--cy)) top left/2px 22px,linear-gradient(var(--cy),var(--cy)) top right/22px 2px,linear-gradient(var(--cy),var(--cy)) top right/2px 22px,linear-gradient(var(--cy),var(--cy)) bottom left/22px 2px,linear-gradient(var(--cy),var(--cy)) bottom left/2px 22px,linear-gradient(var(--cy),var(--cy)) bottom right/22px 2px,linear-gradient(var(--cy),var(--cy)) bottom right/2px 22px;background-repeat:no-repeat}
.app[data-s=listen]{--core:#ffb81c;--k:.45}
.app[data-s=think]{--core:#ff2d3d;--k:.22}
.app[data-s=speak]{--core:#27e6ff;--k:.6}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font:900 22px Orbitron,sans-serif;letter-spacing:.3em;background:linear-gradient(90deg,var(--rd),var(--go));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(255,45,61,.55))}
.clk{text-align:right;font:500 13px Orbitron,sans-serif;color:var(--cy);line-height:1.2}
.clk small{display:block;font:600 12px Rajdhani,sans-serif;color:var(--dm)}
.stage{display:grid;justify-items:center;flex:none}
.rx{width:min(58vw,230px);aspect-ratio:1;display:block;touch-action:none;cursor:grab}
.rx circle{fill:none;transform-box:fill-box;transform-origin:center}
.r1{stroke:var(--core);stroke-width:1.5;stroke-dasharray:2 7;animation:sp calc(30s*var(--k)) linear infinite}
.r2{stroke:var(--core);stroke-width:7;stroke-dasharray:34 12;opacity:.85;animation:sp calc(14s*var(--k)) linear infinite reverse}
.r3{stroke:var(--go);stroke-width:2;stroke-dasharray:70 18 8 18;animation:sp calc(9s*var(--k)) linear infinite}
.rx .r4{stroke:#fff;stroke-opacity:.85;stroke-width:2.5}
.rx .core{fill:url(#g);animation:pu calc(2.4s*var(--k)) ease-in-out infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{50%{transform:scale(1.18);opacity:.8}}
.st{margin-top:2px;font:700 11px Orbitron,sans-serif;letter-spacing:.32em;color:var(--core)}
.log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px;scrollbar-width:none}
.log::-webkit-scrollbar{display:none}
.m{max-width:88%;align-self:flex-start;padding:9px 14px 10px;background:var(--pn);border:1px solid rgba(39,230,255,.4);backdrop-filter:blur(6px);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));animation:in .35s ease both}
.m.u{align-self:flex-end;border-color:rgba(255,184,28,.6)}
.m b{display:block;font:700 9px Orbitron,sans-serif;letter-spacing:.25em;color:var(--cy);margin-bottom:2px}
.m.u b{color:var(--go)}
.m p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.th p{animation:bl 1s infinite}
@keyframes in{from{opacity:0;transform:perspective(600px) translateY(14px) rotateX(-35deg)}}
@keyframes bl{50%{opacity:.25}}
.act{align-self:flex-start;max-width:92%;padding:10px 14px;border:1px solid var(--go);background:rgba(255,184,28,.08);animation:in .35s ease both}
.act p{margin:0 0 8px;color:var(--go)}
.act div{display:flex;gap:8px}
.act a,.act button{font:700 11px Orbitron,sans-serif;letter-spacing:.14em;padding:10px 14px;border-radius:3px;text-decoration:none;cursor:pointer}
.act a{background:var(--go);color:#140c00;border:1px solid var(--go)}
.act button{background:transparent;color:var(--dm);border:1px solid var(--dm)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:700 11px Orbitron,sans-serif;letter-spacing:.08em;color:var(--cy);background:rgba(39,230,255,.06);border:1px solid rgba(39,230,255,.45);border-radius:3px;padding:9px 12px}
.bar{display:flex;gap:8px;align-items:center;flex:none}
#inp,#set input{flex:1;min-width:0;background:rgba(5,10,18,.9);border:1px solid rgba(39,230,255,.45);color:var(--tx);font:500 17px Rajdhani,sans-serif;padding:13px 14px;border-radius:4px;outline:none}
#inp:focus,button:focus-visible{outline:2px solid var(--go);outline-offset:2px}
button{cursor:pointer}
.mic{width:58px;height:58px;flex:none;border-radius:50%;border:2px solid var(--rd);background:radial-gradient(circle,rgba(255,45,61,.4),rgba(255,45,61,.05));color:#fff;display:grid;place-items:center;box-shadow:0 0 16px rgba(255,45,61,.6)}
.mic.on{border-color:var(--go);animation:rp 1s infinite}
@keyframes rp{50%{box-shadow:0 0 30px 6px rgba(255,184,28,.7)}}
.ib{width:46px;height:46px;flex:none;border-radius:4px;border:1px solid var(--cy);background:rgba(39,230,255,.08);color:var(--cy);display:grid;place-items:center;font:700 10px Orbitron,sans-serif}
.ib.off{color:var(--dm);border-color:var(--dm)}
#set{position:fixed;inset:0;z-index:8;background:rgba(2,5,10,.88);display:grid;place-items:center;padding:20px}#set[hidden]{display:none}#set .card{width:100%;max-width:380px;max-height:92%;overflow-y:auto;background:#0a101a;border:1px solid var(--cy);padding:18px;display:grid;gap:12px}#set h2{margin:0;font:700 13px Orbitron,sans-serif;letter-spacing:.3em;color:var(--go)}#set textarea{width:100%;background:rgba(5,10,18,.9);border:1px solid rgba(39,230,255,.45);color:var(--tx);font:500 16px Rajdhani,sans-serif;padding:10px;border-radius:4px;resize:vertical}#set select{background:rgba(5,10,18,.9);border:1px solid rgba(39,230,255,.45);color:var(--tx);font:500 17px Rajdhani,sans-serif;padding:12px;border-radius:4px}#set label{display:grid;gap:6px;font-size:14px;color:var(--dm)}#set p{margin:0;font-size:13px;color:var(--dm)}#set .card div{display:flex;gap:8px}#set button{font:700 11px Orbitron,sans-serif;letter-spacing:.14em;padding:11px 16px;border-radius:3px;border:1px solid var(--cy);background:rgba(39,230,255,.1);color:var(--cy)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:86%;padding:10px 16px;background:#1a0b0e;border:1px solid var(--rd);color:#ffd6d9;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.toast.show{opacity:1}
#boot{position:fixed;inset:0;z-index:9;background:var(--bg);display:grid;place-content:center;text-align:center;transition:opacity .6s}
#boot h1{margin:0;font:900 34px Orbitron,sans-serif;background:linear-gradient(90deg,var(--rd),var(--go));-webkit-background-clip:text;background-clip:text;color:transparent;animation:wd 2s ease forwards}
@keyframes wd{from{letter-spacing:.9em;opacity:0}to{letter-spacing:.3em;opacity:1}}
#boot p{margin:10px 0 0;font:500 11px Orbitron,sans-serif;letter-spacing:.3em;color:var(--cy)}
.pb{width:210px;height:3px;margin:18px auto 0;background:rgba(255,255,255,.1)}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rd),var(--go));animation:ld 2s ease forwards}
@keyframes ld{to{width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="boot"><h1>JARWIS</h1><p>Initializing arc core</p><div class="pb"><i></i></div></div>
<main class="app" data-s="idle">
  <div class="top">
    <div class="logo">JARWIS</div>
    <div style="display:flex;align-items:center;gap:10px"><div class="clk"><span id="clk">--:--</span><small id="dt"></small></div><button class="ib" id="gear" style="width:38px;height:38px;font-size:18px" aria-label="Settings">⚙</button></div>
  </div>
  <div class="stage">
    <canvas class="rx" id="rx" aria-label="3D arc reactor. Drag to rotate."></canvas>
    <div class="st" id="st">STANDBY</div>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips">
    <button class="chip" data-s="What time and date is it?">TIME</button>
    <button class="chip" data-f="Weather in ">WEATHER</button>
    <button class="chip" data-f="Play ">PLAY MUSIC</button>
    <button class="chip" data-s="Show me the top news today">NEWS</button>
    <button class="chip" data-f="Search for ">SEARCH</button>
    <button class="chip" data-s="Tell me a short joke">JOKE</button>
    <button class="chip" data-v="1">CHANGE VOICE</button>
    
  </div>
  <div class="bar">
    <button class="mic" id="mic" aria-label="Speak"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <input id="inp" type="text" placeholder="Tell JARWIS what to do…" autocomplete="off" enterkeyhint="send">
    <button class="ib" id="vo" aria-label="Voice replies">VOICE</button>
    <button class="ib" id="go" aria-label="Send"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
  </div>
</main>
<div id="set" hidden><div class="card"><h2>SETTINGS</h2><label>AI provider<select id="pv"><option value="gemini">Google Gemini</option><option value="or">OpenRouter (Gemma 4)</option></select></label><label><span id="kl">API key</span><input id="k" type="password" autocomplete="off" placeholder="Paste your key"></label><label>Model name<input id="mo"></label><label>Contacts (one per line, Name=+countrycode number, or Name=email)<textarea id="ct" rows="4" placeholder="Mom=+919876543210&#10;Boss=boss@example.com"></textarea></label><p>Your key is saved on this device only.</p><div><button id="sv">SAVE</button><button id="cl">CLOSE</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const app=$('.app'),log=$('#log'),inp=$('#inp'),mb=$('#mic'),vo=$('#vo');
let hist=[],busy=false,voiceOn=true,rec=null,listening=false;
try{voiceOn=localStorage.getItem('jv')!=='0'}catch(e){}
const SYS=`You are JARWIS, a personal assistant in the style of Tony Stark’s J.A.R.V.I.S: calm, sharp, lightly witty, loyal. Occasionally (about one reply in three, not every time) call the user “boss” or “sir”, placed naturally and never after a comma, for example “Right away boss.” or “Sure thing sir.” You only do what the user commands and never act on your own.
LENGTH: For casual chat and simple commands keep replies to 1-2 short sentences. For hard questions (math, logic, riddles, code, system design, ethics, science explanations) give a complete, well-organized answer of whatever length is needed, up to about 300 words, covering every part of the question.
ACCURACY: Reason carefully before answering. For riddles and puzzles, read the exact wording of the question instead of recalling a similar well-known version, and verify your answer against the words given. For ethical dilemmas, weigh the main considerations on both sides, name what is being sacrificed, and give a reasoned view without pretending the answer is easy. Respect word limits exactly. Never claim to have prepared, saved, sent or done something you did not actually do in this reply; if you cannot do something, say so plainly. You cannot see the user’s contacts, phone numbers, files, screen or other apps; the app keeps contacts privately on the phone and only looks numbers up when carrying out an action. If asked about a contact’s number, say you can’t see it and that the user can check or edit it under the gear, Contacts. This does NOT stop you from messaging or calling: when the user asks to message, text, WhatsApp, call or email someone, ALWAYS return the matching action with the name exactly as the user said it and let the app do the lookup. Never refuse or say you cannot access contacts for those requests. If the user names no app for a message, use whatsapp.
OUTPUT: Answer ONLY with one JSON object, no markdown: {"reply":"full text shown on screen","speech":"a spoken version of 1-2 short sentences (omit if reply is already that short)","action":"none|youtube|search|weather|maps|news|whatsapp|sms|email|call|openapp|alarm|timer","query":"song, search text, city or place","name":"contact name as the user said it, never a number","message":"text to send","to":"email address or contact name","subject":"email subject","app":"app name","hour":0,"minute":0,"seconds":0} (include only the fields that apply). Use youtube when asked to play a song or video (query = song and artist). Use search to look something up on the web. Use weather for weather (query = city; if no city is known, ask which city and use action none). Use maps for places or directions. Use news for headlines (query = topic, may be empty). Use whatsapp or sms to message a person (name, message). Use email (to, subject, message). Use call (name). Use openapp (app). Use alarm (hour in 24-hour time, minute, optional message) and timer (seconds). Never invent phone numbers or email addresses. The user always taps send themselves, so say you are preparing it, never that it was sent. Otherwise action none. You cannot fetch live data yourself, so for weather, news and web results say you are opening it for them. Use the date and time given below for time questions.`;
const U=encodeURIComponent;
const ACT={
 youtube:q=>['Play on YouTube','https://www.youtube.com/results?search_query='+U(q)],
 search:q=>['Search the web','https://www.google.com/search?q='+U(q)],
 weather:q=>['Open weather','https://www.google.com/search?q='+U('weather '+q)],
 maps:q=>['Open maps','https://www.google.com/maps/search/?api=1&query='+U(q)],
 news:q=>['Open news','https://news.google.com/search?q='+U(q||'top news')]
};
const APPS={whatsapp:'com.whatsapp',youtube:'com.google.android.youtube',instagram:'com.instagram.android',maps:'com.google.android.apps.maps',gmail:'com.google.android.gm',chrome:'com.android.chrome',facebook:'com.facebook.katana',spotify:'com.spotify.music',telegram:'org.telegram.messenger',snapchat:'com.snapchat.android',twitter:'com.twitter.android',x:'com.twitter.android',phonepe:'com.phonepe.app',gpay:'com.google.android.apps.nbu.paisa.user','google pay':'com.google.android.apps.nbu.paisa.user',paytm:'net.one97.paytm',amazon:'in.amazon.mShop.android.shopping',netflix:'com.netflix.mediaclient',photos:'com.google.android.apps.photos',calendar:'com.google.android.calendar',settings:'com.android.settings'};
function contacts(){let t='';try{t=localStorage.getItem('jcon')||''}catch(e){}const m={};t.split('\n').forEach(l=>{const i=l.indexOf('=');if(i>0)m[l.slice(0,i).trim().toLowerCase()]=l.slice(i+1).trim()});return m}
function findC(C,nm){
 if(!nm)return null;const k=Object.keys(C);
 if(C[nm]!==undefined)return{v:C[nm]};
 let m=k.filter(x=>x.replace(/\s*\(.*?\)\s*/g,' ').trim()===nm);
 if(!m.length)m=k.filter(x=>x.startsWith(nm));
 if(!m.length)m=k.filter(x=>x.includes(nm));
 if(m.length===1)return{v:C[m[0]]};
 if(m.length>1)return{amb:m};
 return null;
}
function PH(o){
 const a=o.action,C=contacts(),nm=String(o.name||'').toLowerCase().trim(),msg=o.message||o.body||'';
 if(a==='whatsapp'||a==='sms'||a==='call'){
  const f=findC(C,nm);
  if(f&&f.amb)return{err:'Which one: '+f.amb.map(x=>x.replace(/\b\w/g,c=>c.toUpperCase())).join(', ')+'?'};
  const v=f&&f.v;
  if(!v||/@/.test(v))return{err:'I don’t have a number saved for “'+(o.name||'that contact')+'”. Add it under the gear, Contacts, with the country code.'};
  const n=v.replace(/[^\d]/g,'');
  if(a==='whatsapp')return{label:'Open WhatsApp chat',detail:o.name+(msg?' – “'+msg+'”':''),url:'https://wa.me/'+n+(msg?'?text='+U(msg):'')};
  if(a==='sms')return{label:'Open text message',detail:o.name+(msg?' – “'+msg+'”':''),url:'sms:+'+n+(msg?'?body='+U(msg):'')};
  return{label:'Call',detail:o.name,url:'tel:+'+n};
 }
 if(a==='email'){
  let to=String(o.to||o.name||'').trim();const k=to.toLowerCase();const f=findC(C,k);if(f&&f.v)to=f.v;
  if(!/^[^\s@]+@[^\s@]+$/.test(to))return{err:'I need an email address for that. Add it under the gear, Contacts, like Boss=boss@example.com.'};
  return{label:'Open email draft',detail:to+(o.subject?' – '+o.subject:''),url:'mailto:'+to+'?subject='+U(o.subject||'')+'&body='+U(msg)};
 }
 if(a==='openapp'){
  const k=String(o.app||o.query||'').toLowerCase().trim(),pk=APPS[k];
  if(!pk)return{err:'I don’t know how to open “'+k+'” yet. Ask me to add it to the app list.'};
  return{label:'Open '+k,detail:'',url:'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package='+pk+';S.browser_fallback_url='+U('https://play.google.com/store/apps/details?id='+pk)+';end'};
 }
 if(a==='alarm'){
  const h=+o.hour,m=+o.minute||0;
  if(!(h>=0&&h<=23)||!(m>=0&&m<=59))return{err:'Tell me the alarm time, for example “wake me at 6:30”.'};
  return{label:'Set alarm',detail:String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'),url:'intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR='+h+';i.android.intent.extra.alarm.MINUTES='+m+';S.android.intent.extra.alarm.MESSAGE='+U(msg||'JARWIS')+';end'};
 }
 if(a==='timer'){
  const sec=Math.round(+o.seconds);
  if(!(sec>0))return{err:'Tell me how long the timer should run.'};
  return{label:'Start timer',detail:Math.floor(sec/60)+' min '+(sec%60)+' s',url:'intent:#Intent;action=android.intent.action.SET_TIMER;i.android.intent.extra.alarm.LENGTH='+sec+';end'};
 }
 return null;
}
function setS(s,t){app.dataset.s=s;$('#st').textContent=t}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3200)}
function add(w,t){const d=document.createElement('div');d.className='m '+w;const b=document.createElement('b');b.textContent=w==='u'?'YOU':'JARWIS';const p=document.createElement('p');p.textContent=t;d.append(b,p);log.append(d);log.scrollTop=log.scrollHeight;return d}
function tick(){const n=new Date();$('#clk').textContent=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});$('#dt').textContent=n.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}
tick();setInterval(tick,1000);
function vbtn(){vo.classList.toggle('off',!voiceOn);vo.textContent=voiceOn?'VOICE':'MUTE'}
vbtn();
vo.onclick=()=>{voiceOn=!voiceOn;vbtn();if(!voiceOn&&window.speechSynthesis)speechSynthesis.cancel();try{localStorage.setItem('jv',voiceOn?'1':'0')}catch(e){}};
let vi=-1;try{vi=+(localStorage.getItem('jvi')||-1)}catch(e){}
let pt=.4;try{pt=+(localStorage.getItem('jpt')||.4)}catch(e){}
const PR=[['Jarvis','m',.3,.9],['Atlas','m',.6,1],['Edith','m',.5,1.1],['Friday','m',.8,1],['Nova','m',.4,1.05]];
let PI=0;try{PI=(+localStorage.getItem('jpr')||0)%5}catch(e){}
function preset(){
 const all=vlist(),M=/daniel|david|george|james|ryan|alex|guy|mark|\bmale|rjs|gbd|gbb|iol|iom|tpd/i,F=/female|zira|samantha|hazel|susan|fiona|karen|victoria|aria|jenny|gba|gbc|gbg|fis|iog|tpc|tpf|sfg/i;
 const p=PR[PI],isF=p[1]==='f';
 let c=all.filter(v=>isF?F.test(v.name):(M.test(v.name)&&!F.test(v.name)));
 if(!c.length)c=all;
 const n=PR.slice(0,PI).filter(q=>q[1]===p[1]).length;
 return{v:c.length?c[n%c.length]:null,p:p[2],r:p[3]};
}
function nextPitch(){
 if(!window.speechSynthesis)return;
 const S=[.8,.6,.4,.25,.1];pt=S[(S.indexOf(pt)+1)%S.length];
 try{localStorage.setItem('jpt',pt)}catch(e){}
 toast('Pitch '+pt+(pt===.1?' (deepest)':''));voiceOn=true;vbtn();speak('This is my deeper voice.');
}
function vlist(){
 const M=/daniel|david|george|james|ryan|alex|guy|mark|\bmale|rjs|gbd|gbb|iol|iom|tpd/i,F=/female|zira|samantha|hazel|susan|fiona|karen|victoria|aria|jenny|gba|gbc|gbg|fis|iog|tpc|tpf|sfg/i;
 return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).map(v=>({v,s:(/en[-_]GB/i.test(v.lang)?3:/en[-_]IN/i.test(v.lang)?1:0)+(M.test(v.name)?5:0)-(F.test(v.name)?6:0)})).sort((a,b)=>b.s-a.s).map(o=>o.v);
}
function nextVoice(){
 if(!window.speechSynthesis)return;
 const L=vlist();

function cfg(){let c={};try{c=JSON.parse(localStorage.getItem('jcfg')||'{}')}catch(e){}const gk=c.gk||c.key||'',ok=c.ok||'',p=c.p==='or'?'or':'gemini';return{p,gk,ok,gm:c.gm||c.model||'',om:c.om||'',key:p==='or'?ok:gk}}
function gem1(prompt,m){return cfg().p==='or'?gemO(prompt,m):gemG(prompt,m)}
async function gemO(prompt,m){
 const c=cfg();let r;
 try{r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},body:JSON.stringify({model:m,messages:[{role:'user',content:prompt}],max_tokens:2500,temperature:.7})})}catch(e){throw{msg:'No connection. Check your internet and try again.'}}
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw{retry:r.status>=500||r.status===429,msg:r.status>=500?'The AI service is busy. Please try again in a moment.':r.status===429?'Free limit reached for now. Wait a minute and try again.':r.status===401?'OpenRouter rejected the key. Check it in Settings.':r.status===402?'This model needs credits on OpenRouter. Pick a model ending in :free.':r.status===404?'That model isn’t available. Change the model name in Settings.':'OpenRouter error '+r.status+'.'};
 const ch=d.choices&&d.choices[0]&&d.choices[0].message;
 return ch&&ch.content?ch.content:'';
}
async function gemG(prompt,m){
 const c=cfg();let r;
 try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':c.key},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:.7,maxOutputTokens:2500,responseMimeType:'application/json'}})})}catch(e){throw{msg:'No connection. Check your internet and try again.'}}
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw{retry:r.status>=500||r.status===429,msg:r.status>=500?'Google’s servers are busy. Please try again in a moment.':r.status===429?'Rate limit reached. Wait a minute and try again.':(r.status===400||r.status===403)?'Gemini rejected the key. Check it in Settings.':r.status===404?'That model isn’t available. Change the model name in Settings.':'Gemini error '+r.status+'.'};
 const p=d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts;
 return p?p.map(x=>x.text||'').join(''):'';

async function gem(prompt){
 const c=cfg(),m=c.p==='or'?(c.om||'google/gemma-4-31b-it:free'):(c.gm||'gemini-flash-latest'),tries=c.p==='or'?[m,m]:[m,m,'gemini-flash-lite-latest'];let err;
 for(let i=0;i<tries.length;i++){
  try{return await gem1(prompt,tries[i])}catch(e){err=e;if(!e.retry)throw e;await new Promise(r=>setTimeout(r,1200*(i+1)))}

}

 const c=w.current,d=w.daily;
 return 'In '+p.name+' it’s '+Math.round(c.temperature_2m)+'°C and '+WC(c.weather_code)+', feels like '+Math.round(c.apparent_temperature)+'°. Today’s range is '+Math.round(d.temperature_2m_min[0])+' to '+Math.round(d.temperature_2m_max[0])+'°C with a '+d.precipitation_probability_max[0]+'% chance of rain.';
}
