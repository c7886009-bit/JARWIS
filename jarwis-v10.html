<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARWIS</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#030409;--panel:rgba(10,10,24,.6);--line:rgba(140,130,255,.18);--cyan:#6ee7ff;--cyan2:#cfd6ff;--amber:#ff9f6b;--green:#5eead4;--txt:#e8eaff;--dim:#7d80a8;--disp:'Michroma','Space Grotesk',sans-serif;--sans:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 60% 10%,#08202c 0,var(--bg) 60%);color:var(--txt);font-family:var(--sans);overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 48px;opacity:.12;mask:radial-gradient(circle at 50% 30%,#000,transparent 75%);-webkit-mask:radial-gradient(circle at 50% 30%,#000,transparent 75%);pointer-events:none}

.app{position:relative;height:100%;display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto 1fr;gap:0 24px;padding:16px 24px 18px;max-width:1500px;margin:auto}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line);position:relative}
header::after{content:"";position:absolute;left:0;bottom:-1px;width:130px;height:2px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
h1{font:400 26px var(--disp);letter-spacing:.34em;text-shadow:0 0 18px rgba(110,231,255,.5)}
.sub{font:500 10px var(--mono);letter-spacing:.22em;color:var(--dim);margin-top:5px}
.pill{display:flex;gap:9px;align-items:center;font:500 11px var(--mono);letter-spacing:.2em;padding:9px 16px;border:1px solid var(--line);border-radius:99px;background:var(--panel);backdrop-filter:blur(10px)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:blink 2.4s infinite}
.pill.warn .dot{background:var(--amber);box-shadow:0 0 10px var(--amber)}
@keyframes blink{50%{opacity:.35}}
.ibtn{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--cyan);cursor:pointer;transition:.25s;font-size:17px}
.ibtn:hover{box-shadow:0 0 18px rgba(110,231,255,.35);transform:translateY(-1px)}
.hr{display:flex;gap:10px;align-items:center}
#menu{display:none}
aside{display:flex;flex-direction:column;gap:14px;min-height:0;padding-top:16px;perspective:1000px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);padding:16px 18px;transform-style:preserve-3d;transition:transform .25s ease-out,box-shadow .3s;box-shadow:0 20px 40px -22px #000,inset 0 1px 0 rgba(255,255,255,.04)}
.card::before,.card::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--cyan);opacity:.8}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.card:hover{box-shadow:0 26px 50px -20px #000,0 0 28px rgba(110,231,255,.12)}
.lbl{font:500 11px var(--mono);letter-spacing:.24em;color:var(--dim);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.clock{font:400 40px var(--disp);letter-spacing:.04em;text-shadow:0 0 22px rgba(207,214,255,.4);margin-bottom:10px;white-space:nowrap}
.row{display:flex;justify-content:space-between;font:500 12px var(--mono);padding:8px 0;border-top:1px solid rgba(140,130,255,.1)}
.row span{color:var(--dim);letter-spacing:.12em}.row b{font-weight:500;color:var(--cyan2)}
.ok{color:var(--green)!important}.am{color:var(--amber)!important}
.recent{flex:1;min-height:0;display:flex;flex-direction:column}
#newchat{font:500 11px var(--mono);letter-spacing:.14em;color:var(--cyan);background:rgba(110,231,255,.08);border:1px solid var(--line);padding:5px 10px;cursor:pointer;transition:.2s}
#newchat:hover{background:rgba(110,231,255,.2)}
#list{overflow:auto;display:flex;flex-direction:column;gap:4px;margin:0 -6px;padding:0 6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.ci{display:flex;align-items:center;gap:8px;padding:10px;border-left:2px solid transparent;cursor:pointer;font-size:13.5px;color:#a9aed6;transition:.2s;animation:in .4s both}
.ci:hover{background:rgba(110,231,255,.07);color:var(--txt)}
.ci.on{border-color:var(--cyan);background:linear-gradient(90deg,rgba(110,231,255,.16),transparent);color:#fff}
.ci i{flex:1;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci button{background:none;border:0;color:var(--dim);cursor:pointer;opacity:0;font-size:14px}
.ci:hover button{opacity:1}.ci button:hover{color:var(--amber)}
.empty{color:var(--dim);font-size:13px;line-height:1.5;padding:8px 2px}
main{display:flex;flex-direction:column;min-height:0;min-width:0;padding-top:6px;position:relative}
#chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:18px;padding:8px 6px 14px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--line) transparent;mask:linear-gradient(transparent,#000 18px);-webkit-mask:linear-gradient(transparent,#000 18px)}
.msg{display:flex;flex-direction:column;gap:7px;max-width:min(760px,92%);animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
.msg.u{align-self:flex-end;align-items:flex-end}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96);filter:blur(5px)}}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}
.meta{display:flex;align-items:center;gap:9px;font:500 10px var(--mono);letter-spacing:.2em;color:var(--dim)}
.meta b{font-weight:500;color:var(--cyan)}.u .meta b{color:var(--amber)}
.av{width:18px;height:18px;border-radius:50%;border:1px solid var(--cyan);display:grid;place-items:center}
.av::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.u .av{border-color:var(--amber)}.u .av::after{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.bub{padding:14px 18px;line-height:1.6;font-size:15.5px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(24,20,52,.8),rgba(8,8,20,.8));clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);overflow-wrap:anywhere;box-shadow:0 14px 30px -18px #000}
.u .bub{border-color:rgba(255,159,107,.35);background:linear-gradient(135deg,rgba(72,34,38,.7),rgba(26,12,16,.8));clip-path:polygon(16px 0,100% 0,100% 100%,0 100%,0 16px)}
.bub code{font:13px var(--mono);background:rgba(110,231,255,.12);padding:2px 6px;border-radius:4px}
.bub pre{font:13px/1.5 var(--mono);background:#05050e;border:1px solid var(--line);padding:12px;margin:8px 0;overflow:auto;white-space:pre}
.cur{display:inline-block;width:8px;height:1.05em;background:var(--cyan);vertical-align:text-bottom;margin-left:2px;box-shadow:0 0 8px var(--cyan);animation:blink .8s steps(1) infinite}
.think{display:flex;align-items:center;gap:14px;font:500 12px var(--mono);letter-spacing:.14em;color:var(--cyan2)}
.bars{display:flex;gap:3px;align-items:center;height:22px}
.bars i{width:3px;height:100%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:eq 1s ease-in-out infinite;transform-origin:center}
.bars i:nth-child(2){animation-delay:.12s}.bars i:nth-child(3){animation-delay:.24s}.bars i:nth-child(4){animation-delay:.36s}.bars i:nth-child(5){animation-delay:.48s}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.shim{background:linear-gradient(90deg,var(--dim),#fff,var(--dim)) 0/200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.8s linear infinite}
@keyframes sh{to{background-position:-200%}}
.dock{flex:none;padding-top:8px}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:10px;scrollbar-width:none}
.chip{flex:none;font:500 11px var(--mono);letter-spacing:.14em;color:var(--cyan2);border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:99px;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(110,231,255,.25);transform:translateY(-2px)}
.comp{display:flex;gap:10px;align-items:center;padding:8px 8px 8px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(8,8,20,.85);backdrop-filter:blur(14px);transition:.3s}
.comp:focus-within{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(110,231,255,.12),0 0 30px rgba(110,231,255,.18)}
#inp{flex:1;background:none;border:0;outline:0;color:var(--txt);font:16px var(--sans);min-width:0;padding:8px 0}
#inp::placeholder{color:var(--dim)}
#mic.on{color:var(--amber);border-color:var(--amber);animation:blink 1s infinite}
#send{background:var(--cyan);color:#05050e;border:0;box-shadow:0 0 20px rgba(110,231,255,.5)}
.ovl{position:fixed;inset:0;background:rgba(0,0,5,.75);backdrop-filter:blur(8px);display:none;place-items:center;z-index:20;padding:20px}
.ovl.show{display:grid}
.modal{width:min(440px,100%);animation:pop .4s both}
.modal label{display:block;font:500 11px var(--mono);letter-spacing:.18em;color:var(--dim);margin:14px 0 6px}
.modal input[type=password],.modal input[type=text]{width:100%;background:#05050e;border:1px solid var(--line);color:var(--txt);padding:11px 12px;font:14px var(--mono);outline:0}
.modal input:focus{border-color:var(--cyan)}
.tg{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btns button{font:500 12px var(--mono);letter-spacing:.14em;padding:10px 18px;border:1px solid var(--line);background:none;color:var(--txt);cursor:pointer}
.btns .pri{background:var(--cyan);color:#05050e;border-color:var(--cyan)}
@media(max-width:900px){
.app{grid-template-columns:minmax(0,1fr);padding:12px 14px;gap:0}
h1{font-size:19px;letter-spacing:.26em}.pill{display:none}
#menu{display:grid}
aside{position:fixed;z-index:15;left:0;top:0;bottom:0;width:min(86vw,320px);padding:calc(16px + env(safe-area-inset-top)) 14px 16px;background:rgba(4,4,10,.97);border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow:auto}
aside.open{transform:none}
#orb{width:190px;height:190px}.stage{height:190px}
.ci button{opacity:1}
}
.act{align-self:flex-start;max-width:min(560px,92%);padding:12px 14px;border:1px solid rgba(255,159,107,.5);background:rgba(255,159,107,.07);animation:pop .4s both}
.at{font:500 12px var(--mono);color:var(--amber);letter-spacing:.05em;margin-bottom:10px;overflow-wrap:anywhere}
.ar{display:flex;gap:10px}.ar a,.ar button{font:500 11px var(--mono);letter-spacing:.14em;padding:9px 16px;border:1px solid var(--amber);text-decoration:none;cursor:pointer}
.ar a{background:var(--amber);color:#1a0c04}.ar button{background:none;color:var(--dim);border-color:var(--line)}
.modal{max-height:92vh;overflow:auto}.modal textarea{width:100%;background:#05050e;border:1px solid var(--line);color:var(--txt);padding:10px 12px;font:13px var(--mono);outline:0;resize:vertical}
#att.on{color:var(--amber);border-color:var(--amber)}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:88%;padding:10px 16px;background:#14101f;border:1px solid var(--amber);color:#ffe3d3;font:500 12px var(--mono);text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
.stage{height:270px;position:relative;display:grid;place-items:center;flex:none}
#orb{width:270px;height:270px;filter:drop-shadow(0 0 34px rgba(130,100,255,.4))}
.stage::after{content:"";position:absolute;bottom:0;width:230px;height:26px;background:radial-gradient(ellipse,rgba(130,100,255,.32),transparent 70%);filter:blur(8px)}
body{background:radial-gradient(900px 620px at 72% -8%,rgba(120,80,255,.22),transparent 62%),radial-gradient(760px 560px at -5% 105%,rgba(0,210,255,.11),transparent 62%),radial-gradient(520px 420px at 105% 100%,rgba(255,95,162,.09),transparent 65%),#030409}
body::before{opacity:.05}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7));pointer-events:none}
.card{background:linear-gradient(160deg,rgba(32,26,66,.5),rgba(6,7,16,.74))}
h1{background:linear-gradient(90deg,#fff,#b9a9ff 60%,#6ee7ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(140,110,255,.45))}
header::after{background:linear-gradient(90deg,#6ee7ff,#9b7bff,transparent);box-shadow:0 0 14px rgba(140,110,255,.8)}
.bars i{background:linear-gradient(#6ee7ff,#b06bff);box-shadow:0 0 8px rgba(140,110,255,.8)}
#send{background:linear-gradient(135deg,#6ee7ff,#9b7bff);box-shadow:0 0 22px rgba(140,110,255,.5)}
.ci.on{border-color:#9b7bff;background:linear-gradient(90deg,rgba(140,110,255,.2),transparent)}
.cur{background:#b9a9ff;box-shadow:0 0 8px #9b7bff}
.modal select{width:100%;background:#05050e;border:1px solid var(--line);color:var(--txt);padding:11px 12px;font:14px var(--mono);outline:0}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div class="hr"><button class="ibtn" id="menu" aria-label="Recent chats">☰</button>
  <div><h1>JARWIS</h1><div class="sub">PERSONAL INTELLIGENCE · MK X</div></div></div>
  <div class="pill" id="pill"><span class="dot"></span><span id="pilltxt">ALL SYSTEMS NOMINAL</span></div>
  <div class="hr"><button class="ibtn" id="spk" aria-label="Toggle voice">🔊</button><button class="ibtn" id="gear" aria-label="Settings">⚙</button></div>
</header>

<aside id="side">
  <div class="card tilt"><div class="lbl">LOCAL TIME</div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="row"><span>DATE</span><b id="date">–</b></div>
    <div class="row"><span>ZONE</span><b id="zone">–</b></div></div>
  <div class="card tilt"><div class="lbl">SYSTEM STATUS</div>
    <div class="row"><span>AI CORE</span><b id="core">–</b></div>
    <div class="row"><span>MODEL</span><b id="model">–</b></div>
    <div class="row"><span>UPLINK</span><b id="net">–</b></div>
    <div class="row"><span>POWER</span><b id="pow">–</b></div>
    <div class="row"><span>UPTIME</span><b id="up">00:00:00</b></div></div>
  <div class="card recent"><div class="lbl">RECENT CHATS <button id="newchat">+ NEW</button></div>
    <div id="list"></div></div>
</aside>

<main id="mainEl">
  <div class="stage"><canvas id="orb" aria-hidden="true"></canvas></div>
  <div id="chat" aria-live="polite"></div>
  <div class="dock">
    <div class="chips" id="chips">
      <button class="chip" data-send="What time is it right now?">TIME</button>
      <button class="chip" data-fill="Weather in ">WEATHER</button>
      <button class="chip" data-fill="Wake me at ">ALARM</button>
      <button class="chip" data-fill="WhatsApp ">WHATSAPP</button>
      <button class="chip" data-fill="Email ">EMAIL</button>
      <button class="chip" data-fill="Play ">PLAY</button>
      <button class="chip" data-img="1">IMAGE</button>
      <button class="chip" data-fill="Latest news about ">NEWS</button>
      <button class="chip" data-send="Tell me a clever joke.">JOKE</button>
      <button class="chip" data-fill="Search and explain: ">SEARCH</button>
    </div>
    <div class="comp">
      <input id="inp" placeholder="Talk to JARWIS…" autocomplete="off" enterkeyhint="send">
      <button class="ibtn" id="att" aria-label="Attach image">📎</button><input type="file" id="im" accept="image/*" hidden><button class="ibtn" id="mic" aria-label="Voice input">🎙</button>
      <button class="ibtn" id="send" aria-label="Send">➤</button>
    </div>
  </div>
</main>
</div>

<div class="ovl" id="ovl"><div class="card modal">
  <div class="lbl">SETTINGS</div>
  <label>GEMINI API KEY</label><input type="password" id="key" placeholder="Paste your key" autocomplete="off">
  <label>MODEL</label><input type="text" id="mdl" placeholder="gemini-flash-latest">
  <label>VOICE</label><select id="voice"><option value="Charon">Charon · deep, composed</option><option value="Orus">Orus · firm</option><option value="Algenib">Algenib · gravelly</option><option value="Achird">Achird · friendly</option><option value="Umbriel">Umbriel · easy-going</option><option value="Algieba">Algieba · smooth</option><option value="Iapetus">Iapetus · clear</option><option value="Fenrir">Fenrir · energetic</option><option value="Puck">Puck · upbeat</option></select><label>VOICE MODEL</label><input type="text" id="tmdl" placeholder="gemini-3.1-flash-tts-preview"><label>CONTACTS · one per line: Name=+countrycode number, or Name=email</label><textarea id="ct" rows="4" placeholder="Mom=+919876543210&#10;Boss=boss@example.com"></textarea><div class="tg"><input type="checkbox" id="tts"><span>Speak replies aloud</span></div>
  <div class="btns"><button id="test">TEST VOICE</button><button id="cancel">CANCEL</button><button class="pri" id="save">SAVE</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
(function(){try{if(localStorage.getItem('jw.cfg')==null){const o=JSON.parse(localStorage.getItem('jcfg')||'{}'),k=o.gk||o.key;if(k)localStorage.setItem('jw.cfg',JSON.stringify({key:k,model:o.gm||o.model||'gemini-flash-latest',tts:true,voice:'Charon'}))}}catch(e){}})();
let cfg=Object.assign({key:'',model:'gemini-flash-latest',tts:true,voice:'Charon'},store.get('jw.cfg',{}));
if(!store.get('jw.v9',0)){cfg.tts=true;cfg.voice=cfg.voice||'Charon';store.set('jw.v9',1);store.set('jw.cfg',cfg)}
let chats=store.get('jw.chats',[]),cur=null,busy=false;
const save=()=>store.set('jw.chats',chats);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=s=>esc(mth2(s)).replace(/```(?:\w+)?\n?([\s\S]*?)(```|$)/g,(m,c)=>'<pre>'+c+'</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/^[-*] /gm,'• ').replace(/\n/g,'<br>').replace(/<\/pre><br>/g,'</pre>');
const hm=t=>new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});
let ORB='';const mode=m=>{ORB=m};
const cv=$('orb'),g2=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);let S=270,mx=0,my=0,sx=0,sy=0;
const fit=()=>{S=cv.clientWidth||270;cv.width=cv.height=S*dpr;g2.setTransform(dpr,0,0,dpr,0,0)};fit();addEventListener('resize',fit);
const N=240,P=[],E=[];
for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*2.39996;P.push([Math.cos(a)*r,y,Math.sin(a)*r])}
for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){if(Math.hypot(P[i][0]-P[j][0],P[i][1]-P[j][1],P[i][2]-P[j][2])<.36)E.push([i,j])}
const M={'':[.004,.025,1],thinking:[.035,.1,1.5],speaking:[.009,.16,1.25]};let spd=.004,amp=.02,glow=1,rot=0,tm=0;
function frame(){const m=M[ORB]||M[''];tm+=.016;spd+=(m[0]-spd)*.06;amp+=(m[1]-amp)*.08;glow+=(m[2]-glow)*.06;rot+=spd;sx+=(mx-sx)*.05;sy+=(my-sy)*.05;
g2.clearRect(0,0,S,S);const c=S/2,R=S*.33;
const gr=g2.createRadialGradient(c,c,R*.2,c,c,R*1.7);gr.addColorStop(0,`rgba(130,100,255,${.2*glow})`);gr.addColorStop(.55,`rgba(94,231,255,${.05*glow})`);gr.addColorStop(1,'rgba(0,0,0,0)');g2.fillStyle=gr;g2.fillRect(0,0,S,S);

if(IMGX&&ct.length)ct[ct.length-1].parts.push({inline_data:{mime_type:IMGX.mime,data:IMGX.data}});

const go=f=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},body:body(f)});
let r=await go(fast);if(!r.ok&&fast)r=await go(false);
if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error&&j.error.message||'HTTP '+r.status)}
const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(line.indexOf('data:')!==0)continue;
try{const j=JSON.parse(line.slice(5));const t=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.thought?'':p.text||'').join('');if(t)onChunk(t)}catch(e){}}}}
async function send(text){text=(text||'').trim();if(!text&&IMGX)text='Describe this image and tell me what matters.';if(!text||busy)return;ctxA();stopSpeak();
if(!cfg.key){addMsg('u',text,Date.now(),false);addMsg('a','Add your API key first. Tap the gear icon at the top.',Date.now(),true);openSet();return}
busy=true;spoken=0;$('inp').value='';
if(!cur){const c={id:'c'+Date.now(),title:text.slice(0,34),ts:Date.now(),msgs:[]};chats.push(c);cur=c.id}
const c=chats.find(x=>x.id===cur);if(!c.msgs.length)$('chat').innerHTML='';
const now=Date.now();c.msgs.push({r:'u',t:text+(IMGX?' [image attached]':''),ts:now});c.ts=now;save();renderList();{const ub=addMsg('u',text,now,false);if(IMGX&&IMGU){const im=document.createElement('img');im.src=IMGU;im.alt='Attached image';im.style.cssText='display:block;max-width:100%;max-height:180px;margin-top:8px;border-radius:6px';ub.append(im)}}
{const L=localAns(text);if(L){c.msgs.push({r:'a',t:L,ts:Date.now()});save();addMsg('a',L,Date.now(),true);spoken=0;feed(L,true);busy=false;return}}
const w=document.createElement('div');w.className='msg a';
w.innerHTML='<div class="meta"><span class="av"></span><b>JARWIS</b></div><div class="bub"><div class="think"><div class="bars"><i></i><i></i><i></i><i></i><i></i></div><span class="shim" id="ph">'+phases[0]+'…</span></div></div>';
$('chat').appendChild(w);scroll();mode('thinking');
let pi=0;const pt=setInterval(()=>{pi=(pi+1)%phases.length;const p=$('ph');if(p)p.textContent=phases[pi]+'…'},1200);
let reply='',b=null,raf=0,err='';
const begin=()=>{if(!b){clearInterval(pt);w.remove();b=addMsg('a','',Date.now(),false)}};
const paint=()=>{raf=0;if(b){b.innerHTML=md(vis(reply))+(streaming?'<span class="cur"></span>':'');scroll()}};
try{await stream(c,t=>{if(!b){begin();streaming=true;mode('speaking')}reply+=t;feed(vis(reply),false);if(!raf)raf=requestAnimationFrame(paint)},fastQ(text))}
catch(e){err=e.message}
begin();streaming=false;cancelAnimationFrame(raf);const act=takeAct(reply);reply=reply.replace(/\[\[[\s\S]*$/,'').trim();if(!reply&&act)reply='On it.';
if(!reply){reply='Connection fault: '+(err||'empty response. Check your key and model.');c.msgs.pop()}else{c.msgs.push({r:'a',t:reply,ts:Date.now()});feed(reply,true)}
save();paint();busy=false;IMGX=null;IMGU='';$('att').classList.remove('on');if(!live)mode('');if(act)runAct(act)}

$('send').onclick=()=>send($('inp').value);
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send($('inp').value)});
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;if(b.dataset.img){$('im').click();return}if(b.dataset.send)send(b.dataset.send);else{$('inp').value=b.dataset.fill;$('inp').focus()}};
$('newchat').onclick=()=>{newChat();$('side').classList.remove('open')};
$('menu').onclick=()=>$('side').classList.toggle('open');
$('mainEl').addEventListener('click',()=>$('side').classList.remove('open'));

/* voice input */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)$('mic').style.display='none';else{const rec=new SR();rec.lang=navigator.language||'en-US';rec.interimResults=true;
rec.onresult=e=>{$('inp').value=[...e.results].map(r=>r[0].transcript).join('');if(e.results[e.results.length-1].isFinal)send($('inp').value)};
rec.onend=()=>$('mic').classList.remove('on');
$('mic').onclick=()=>{if($('mic').classList.contains('on')){rec.stop();return}try{rec.start();$('mic').classList.add('on')}catch(e){}}}

/* settings */
function openSet(){$('tmdl').value=cfg.tmodel||'';try{$('ct').value=localStorage.getItem('jcon')||''}catch(e){}$('key').value=cfg.key;$('mdl').value=cfg.model;$('voice').value=cfg.voice;$('tts').checked=cfg.tts;$('ovl').classList.add('show')}
$('gear').onclick=openSet;$('cancel').onclick=()=>$('ovl').classList.remove('show');
$('ovl').onclick=e=>{if(e.target===$('ovl'))$('ovl').classList.remove('show')};
$('save').onclick=()=>{cfg={key:$('key').value.trim(),model:$('mdl').value.trim()||'gemini-flash-latest',tts:$('tts').checked,voice:$('voice').value,tmodel:$('tmdl').value.trim()};try{localStorage.setItem('jcon',$('ct').value)}catch(e){}store.set('jw.cfg',cfg);tf=0;status();spk();$('ovl').classList.remove('show')};
$('test').onclick=()=>{const k=$('key').value.trim();if(k)cfg.key=k;cfg.voice=$('voice').value;tf=0;stopSpeak();ctxA();enqueue('Good evening. JARWIS at your service.')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('ovl').classList.remove('show')});

spk();newChat();
</script>
<div class="toast" id="toast"></div>
</body>
</html>
